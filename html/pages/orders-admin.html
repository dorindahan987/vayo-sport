<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VAYO — ניהול הזמנות</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0e0e10;
      --surface:  #18181c;
      --surface2: #1f1f24;
      --border:   #2a2a30;
      --border2:  #333340;
      --text:     #f0f0f0;
      --text-sub: #a0a0b0;
      --text-dim: #6a6a7a;
      --accent:   #6AEBD6;
      --accent-bg:rgba(106,235,214,0.08);
      --blue:     #6ab0eb;
      --blue-bg:  rgba(106,176,235,0.08);
      --yellow:   #f0c060;
      --yellow-bg:rgba(240,192,96,0.08);
      --red:      #e87070;
      --red-bg:   rgba(232,112,112,0.08);
    }

    body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans Hebrew', sans-serif; min-height: 100vh; }

    /* ── Topbar ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 32px; border-bottom: 1px solid var(--border);
      background: var(--surface); position: sticky; top: 0; z-index: 100;
    }
    .topbar-left { display: flex; align-items: center; gap: 20px; }
    .topbar-logo { font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; letter-spacing: 0.14em; color: var(--accent); }
    .topbar-sep  { width: 1px; height: 18px; background: var(--border2); }
    .topbar-title{ font-size: 13px; color: var(--text-sub); }
    .refresh-btn {
      background: none; border: 1px solid var(--border2); color: var(--text-sub);
      font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 7px 14px; cursor: pointer; transition: all 0.15s;
    }
    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Stats ── */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border-bottom: 1px solid var(--border); }
    .stat { background: var(--surface); padding: 24px 28px; }
    .stat-val { font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700; color: var(--text); line-height: 1; }
    .stat-val.accent { color: var(--accent); }
    .stat-lbl { font-size: 12px; color: var(--text-sub); margin-top: 6px; }

    /* ── Toolbar ── */
    .toolbar {
      display: flex; align-items: center; gap: 10px;
      padding: 16px 32px; border-bottom: 1px solid var(--border);
      background: var(--surface); flex-wrap: wrap;
    }
    .filter-group { display: flex; gap: 4px; }
    .filter-btn {
      background: none; border: 1px solid var(--border2); color: var(--text-dim);
      font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.08em;
      text-transform: uppercase; padding: 7px 16px; cursor: pointer; transition: all 0.15s;
    }
    .filter-btn:hover           { border-color: var(--border2); color: var(--text-sub); }
    .filter-btn.active          { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
    .filter-btn.active.yellow   { border-color: var(--yellow); color: var(--yellow); background: var(--yellow-bg); }
    .filter-btn.active.blue     { border-color: var(--blue);   color: var(--blue);   background: var(--blue-bg); }
    .filter-btn.active.dim      { border-color: var(--border2);color: var(--text-sub);background: var(--surface2); }

    .search-wrap { margin-right: auto; position: relative; }
    .search-wrap svg { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); opacity: 0.35; }
    .search {
      background: var(--surface2); border: 1px solid var(--border2); color: var(--text);
      font-family: 'IBM Plex Sans Hebrew', sans-serif; font-size: 13px;
      padding: 8px 36px 8px 14px; outline: none; width: 240px; border-radius: 2px;
    }
    .search::placeholder { color: var(--text-dim); }
    .search:focus { border-color: var(--accent); }

    /* ── Main content ── */
    main { padding: 28px 32px; max-width: 1200px; }

    /* ── Order cards ── */
    .orders-list { display: flex; flex-direction: column; gap: 12px; }

    .order-card {
      background: var(--surface); border: 1px solid var(--border);
      transition: border-color 0.15s;
    }
    .order-card:hover { border-color: var(--border2); }
    .order-card.status-paid     { border-right: 3px solid var(--yellow); }
    .order-card.status-shipped  { border-right: 3px solid var(--blue); }
    .order-card.status-pending  { border-right: 3px solid var(--border2); }

    .card-header {
      display: flex; align-items: center; gap: 20px;
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .order-id { font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.1em; }
    .order-date { font-size: 12px; color: var(--text-dim); font-family: 'Space Mono', monospace; }
    .header-spacer { flex: 1; }
    .order-total { font-family: 'Space Mono', monospace; font-size: 16px; font-weight: 700; color: var(--text); }

    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 12px; font-family: 'Space Mono', monospace;
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .badge::before { content: ''; display: block; width: 6px; height: 6px; border-radius: 50%; }
    .badge-pending  { border: 1px solid var(--border2); color: var(--text-sub); }
    .badge-pending::before  { background: var(--border2); }
    .badge-paid     { border: 1px solid var(--yellow); color: var(--yellow); background: var(--yellow-bg); }
    .badge-paid::before     { background: var(--yellow); }
    .badge-shipped  { border: 1px solid var(--blue); color: var(--blue); background: var(--blue-bg); }
    .badge-shipped::before  { background: var(--blue); }
    .badge-cancelled{ border: 1px solid var(--red); color: var(--red); background: var(--red-bg); }
    .badge-cancelled::before{ background: var(--red); }

    .card-body {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0;
    }
    .card-section {
      padding: 16px 20px; border-left: 1px solid var(--border);
    }
    .card-section:last-child { border-left: none; }
    .section-label { font-size: 10px; font-family: 'Space Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; }

    .customer-name  { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .customer-line  { font-size: 13px; color: var(--text-sub); margin-top: 2px; }
    .customer-line a{ color: var(--accent); text-decoration: none; }

    .items-list { display: flex; flex-direction: column; gap: 6px; }
    .item-row   { display: flex; justify-content: space-between; align-items: center; }
    .item-name  { font-size: 13px; color: var(--text-sub); }
    .item-qty   { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--text-dim); }

    .tracking-block {
      display: flex; flex-direction: column; gap: 6px;
      background: var(--blue-bg); border: 1px solid rgba(106,176,235,0.2);
      padding: 10px 14px;
    }
    .tracking-carrier { font-size: 12px; color: var(--text-sub); }
    .tracking-num { font-family: 'Space Mono', monospace; font-size: 13px; color: var(--blue); font-weight: 700; }

    /* Ship action */
    .ship-action { display: flex; flex-direction: column; gap: 10px; }
    .ship-row { display: flex; gap: 8px; }
    .ship-input {
      background: var(--surface2); border: 1px solid var(--border2); color: var(--text);
      font-family: 'Space Mono', monospace; font-size: 12px;
      padding: 8px 12px; outline: none; flex: 1; min-width: 0;
    }
    .ship-input::placeholder { color: var(--text-dim); }
    .ship-input:focus { border-color: var(--accent); }
    .ship-input.sm { flex: 0 0 100px; }
    .btn-ship {
      background: var(--accent); color: #060606; border: none;
      font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 0 18px; cursor: pointer; white-space: nowrap; transition: opacity 0.15s;
    }
    .btn-ship:hover    { opacity: 0.85; }
    .btn-ship:disabled { opacity: 0.3; cursor: not-allowed; }

    /* States */
    .empty {
      text-align: center; padding: 80px 20px; color: var(--text-dim);
      font-family: 'Space Mono', monospace; font-size: 12px;
    }
    .empty svg { margin-bottom: 16px; opacity: 0.2; }
    .loading {
      text-align: center; padding: 80px 20px; color: var(--text-dim);
      font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em;
    }
    .error-msg {
      padding: 60px 20px; text-align: center;
      font-family: 'Space Mono', monospace; font-size: 13px; color: var(--red);
    }

    /* ── Responsive ── */
    @media (max-width: 800px) {
      .topbar { padding: 14px 16px; }
      main { padding: 16px; }
      .toolbar { padding: 12px 16px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .card-body { grid-template-columns: 1fr; }
      .card-section { border-left: none; border-top: 1px solid var(--border); }
      .card-section:first-child { border-top: none; }
      .search-wrap { margin-right: 0; width: 100%; }
      .search { width: 100%; }
      .filter-group { flex-wrap: wrap; }
    }
    @media (max-width: 480px) {
      .stats { grid-template-columns: 1fr 1fr; }
      .stat { padding: 16px; }
      .stat-val { font-size: 22px; }
      .card-header { gap: 10px; }
    }
  </style>
</head>
<body>

<!-- Topbar -->
<header class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">VAYO</div>
    <div class="topbar-sep"></div>
    <div class="topbar-title">ניהול הזמנות</div>
  </div>
  <button class="refresh-btn" onclick="loadOrders()">רענן</button>
</header>

<!-- Stats -->
<div class="stats" id="stats">
  <div class="stat">
    <div class="stat-val" id="st-total">—</div>
    <div class="stat-lbl">סה"כ הזמנות</div>
  </div>
  <div class="stat">
    <div class="stat-val accent" id="st-paid">—</div>
    <div class="stat-lbl">ממתינות למשלוח</div>
  </div>
  <div class="stat">
    <div class="stat-val" id="st-shipped">—</div>
    <div class="stat-lbl">נשלחו</div>
  </div>
  <div class="stat">
    <div class="stat-val" id="st-revenue">—</div>
    <div class="stat-lbl">הכנסות</div>
  </div>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <div class="filter-group">
    <button class="filter-btn active" data-filter="all">הכל</button>
    <button class="filter-btn yellow" data-filter="paid">ממתין למשלוח</button>
    <button class="filter-btn blue"   data-filter="shipped">נשלח</button>
    <button class="filter-btn dim"    data-filter="pending">טרם שולם</button>
  </div>
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <circle cx="6" cy="6" r="4.5" stroke="#fff" stroke-width="1.5"/>
      <path d="M9.5 9.5L13 13" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <input type="text" class="search" id="search" placeholder="חיפוש לפי שם, הזמנה, טלפון..." />
  </div>
</div>

<!-- Orders -->
<main>
  <div id="orders-container">
    <div class="loading">טוען הזמנות...</div>
  </div>
</main>

<script>
  const KEY = new URLSearchParams(location.search).get('key') || '';
  if (!KEY) {
    document.body.innerHTML = '<div class="error-msg">Missing ?key= parameter</div>';
  }

  let allOrders = [];
  let activeFilter = 'all';

  async function loadOrders() {
    document.getElementById('orders-container').innerHTML = '<div class="loading">טוען הזמנות...</div>';
    const r = await fetch('/api/admin/orders?key=' + KEY);
    if (r.status === 401) {
      document.body.innerHTML = '<div class="error-msg">Unauthorized — wrong admin key</div>';
      return;
    }
    allOrders = await r.json();
    updateStats();
    render();
  }

  function updateStats() {
    const paid    = allOrders.filter(o => o.status === 'paid').length;
    const shipped = allOrders.filter(o => o.status === 'shipped').length;
    const revenue = allOrders.filter(o => ['paid','shipped'].includes(o.status))
                             .reduce((s, o) => s + (o.total || 0), 0);
    document.getElementById('st-total').textContent   = allOrders.length;
    document.getElementById('st-paid').textContent    = paid;
    document.getElementById('st-shipped').textContent = shipped;
    document.getElementById('st-revenue').textContent = revenue.toLocaleString('he-IL') + ' ₪';
  }

  function render() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const orders = allOrders.filter(o => {
      if (activeFilter !== 'all' && o.status !== activeFilter) return false;
      if (q) {
        const hay = (o.id + (o.customer?.name || '') + (o.customer?.phone || '') + (o.customer?.email || '')).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    if (!orders.length) {
      document.getElementById('orders-container').innerHTML = `
        <div class="empty">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <rect x="8" y="12" width="24" height="20" rx="1" stroke="white" stroke-width="1.5"/>
            <path d="M14 20h12M14 25h8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M14 12V9a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v3" stroke="white" stroke-width="1.5"/>
          </svg>
          <div>אין הזמנות להצגה</div>
        </div>`;
      return;
    }

    const cards = orders.map(o => buildCard(o)).join('');
    document.getElementById('orders-container').innerHTML = `<div class="orders-list">${cards}</div>`;
  }

  function buildCard(o) {
    const dateStr = o.created_at
      ? o.created_at.replace('T', ' ').slice(0, 16)
      : '';

    const badge = `<span class="badge badge-${o.status}">${statusLabel(o.status)}</span>`;

    // Items
    const itemsHtml = (o.items || []).map(i => `
      <div class="item-row">
        <span class="item-name">${i.name}${i.variant ? ' <span style="color:var(--text-dim);font-size:11px;">— ' + i.variant + '</span>' : ''}</span>
        <span class="item-qty">x${i.qty}</span>
      </div>`).join('');

    // Address
    const addr = o.customer?.address || '';

    // Action column
    let actionHtml = '';
    if (o.status === 'paid') {
      actionHtml = `
        <div class="ship-action">
          <div class="ship-row">
            <input class="ship-input sm" placeholder="ספק" id="carrier-${o.id}" />
            <input class="ship-input" placeholder="מספר מעקב" id="tracking-${o.id}" />
          </div>
          <button class="btn-ship" onclick="ship('${o.id}')">סמן כנשלח</button>
        </div>`;
    } else if (o.status === 'shipped' && o.tracking) {
      actionHtml = `
        <div class="tracking-block">
          <div class="tracking-carrier">${o.carrier || 'משלוח'}</div>
          <div class="tracking-num">${o.tracking}</div>
        </div>`;
    } else {
      actionHtml = `<div style="color:var(--text-dim);font-size:12px;">—</div>`;
    }

    return `
      <div class="order-card status-${o.status}">
        <div class="card-header">
          <div class="order-id">#${o.id}</div>
          <div class="order-date">${dateStr}</div>
          <div class="header-spacer"></div>
          <div class="order-total">${(o.total || 0).toLocaleString('he-IL')} ₪</div>
          ${badge}
        </div>
        <div class="card-body">
          <div class="card-section">
            <div class="section-label">לקוח</div>
            <div class="customer-name">${o.customer?.name || ''}</div>
            <div class="customer-line">
              <a href="tel:${o.customer?.phone || ''}">${o.customer?.phone || ''}</a>
            </div>
            <div class="customer-line">${o.customer?.email || ''}</div>
            ${addr ? `<div class="customer-line" style="margin-top:8px;color:var(--text-dim);font-size:12px;">${addr}</div>` : ''}
          </div>
          <div class="card-section">
            <div class="section-label">מוצרים</div>
            <div class="items-list">${itemsHtml}</div>
          </div>
          <div class="card-section">
            <div class="section-label">משלוח</div>
            ${actionHtml}
          </div>
        </div>
      </div>`;
  }

  function statusLabel(s) {
    return { pending: 'טרם שולם', paid: 'שולם - ממתין', shipped: 'נשלח', cancelled: 'בוטל', refunded: 'הוחזר' }[s] || s;
  }

  async function ship(orderId) {
    const tracking = document.getElementById('tracking-' + orderId)?.value.trim() || '';
    const carrier  = document.getElementById('carrier-'  + orderId)?.value.trim() || '';
    const btn = document.querySelector(`button[onclick="ship('${orderId}')"]`);
    if (btn) { btn.disabled = true; btn.textContent = 'שולח...'; }
    const r = await fetch(`/api/admin/orders/${orderId}/ship?key=${KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tracking, carrier })
    });
    const d = await r.json();
    if (d.ok) {
      await loadOrders();
    } else {
      alert(d.error || 'שגיאה');
      if (btn) { btn.disabled = false; btn.textContent = 'סמן כנשלח'; }
    }
  }

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      render();
    });
  });
  document.getElementById('search').addEventListener('input', render);

  loadOrders();
</script>
</body>
</html>
